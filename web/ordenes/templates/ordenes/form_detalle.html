{% extends "ordenes/base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="migas"><a href="{% url 'lista_ordenes' %}">Órdenes</a><span>/</span><span>{{ titulo }}</span></div>

<div class="page-head">
  <div>
    <h1>{{ titulo }}</h1>
    {% if orden %}<p class="sub">Orden #{{ orden.id }} · {{ orden.cliente }}</p>{% endif %}
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" action="{{ accion }}">
      {% csrf_token %}
      <div class="form-grid">
        <div class="campo">
          <label for="producto">Producto</label>
          <input type="text" id="producto" name="producto" maxlength="120" required
                 placeholder="Nombre del producto"
                 value="{% if valores %}{{ valores.producto }}{% endif %}">
        </div>
        <div class="campo">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" name="cantidad" min="1" step="1" required
                 value="{% if valores %}{{ valores.cantidad }}{% else %}1{% endif %}">
        </div>
        <div class="campo">
          <label for="precio_unitario">Precio unitario</label>
          <input type="number" id="precio_unitario" name="precio_unitario" min="0" step="0.01" required
                 value="{% if valores %}{{ valores.precio_unitario }}{% else %}0.00{% endif %}">
        </div>
      </div>
      <div class="form-foot">
        <button class="btn" type="submit">{{ boton }}</button>
        <a class="btn btn-sec" href="{% if orden %}{% url 'detalle_orden' orden.id %}{% else %}{% url 'lista_ordenes' %}{% endif %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
