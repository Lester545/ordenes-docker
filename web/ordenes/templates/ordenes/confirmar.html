{% extends "ordenes/base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="migas"><a href="{% url 'lista_ordenes' %}">Órdenes</a><span>/</span><span>{{ titulo }}</span></div>

<div class="page-head">
  <div>
    <h1>{{ titulo }}</h1>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <p style="margin:0;color:var(--ink-2)">{{ mensaje }}</p>
    <div class="form-foot">
      <form method="post" action="{{ accion }}">
        {% csrf_token %}
        <button class="btn btn-peligro" type="submit">{{ boton }}</button>
      </form>
      <a class="btn btn-sec" href="{{ cancelar }}">Cancelar</a>
    </div>
  </div>
</div>
{% endblock %}
